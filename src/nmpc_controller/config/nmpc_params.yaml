nmpc_node:
  ros__parameters:

    # Path to reference trajectory file (.npy, shape [T, 3]: each row is [x, y, theta])
    traj_file: '/home/jinwooseo/ros2_ws/src/nmpc_controller/scripts/ref_traj.npy'

    # NMPC horizon
    N:   20      # prediction steps
    dt:  0.1     # time step [s]  (= control period)

    # Hardware constraints (matching motor_driver_node limits)
    v_max: 0.3   # max linear speed  [m/s]
    w_max: 1.5   # max angular speed [rad/s]

    # State tracking cost weights Q = diag(Q_x, Q_y, Q_theta)
    Q_x:     2.0
    Q_y:     2.0
    Q_theta: 0.5

    # Input regularisation weights R = diag(R_v, R_w)
    R_v: 0.1
    R_w: 0.05

    # Terminal cost weights Q_N = diag(QN_x, QN_y, QN_theta)
    QN_x:     4.0
    QN_y:     4.0
    QN_theta: 1.0

    # Safety: stop if odometry is stale for this many seconds
    odom_timeout: 1.0
