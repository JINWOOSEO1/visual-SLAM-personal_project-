nmpc_node:
  ros__parameters:

    # Path to reference trajectory file (.npy, shape [T, 3]: each row is [x, y, theta])
    # Default value is provided by nmpc.launch.py (package share); override with
    # `traj_file:=<absolute path>` on the launch command line if needed.
    traj_file: ''
    real_traj_file: ''

    # NMPC horizon
    N:   20      # prediction steps
    dt:  0.2     # time step [s]  (= control period)

    # Hardware constraints
    # NMPC constrains each wheel speed, not body-frame v directly:
    # v_left = v - w*wheel_base/2, v_right = v + w*wheel_base/2.
    wheel_base:  0.150  # m
    wheel_v_min: 0.15    # min left/right wheel speed [m/s]
    wheel_v_max: 0.60   # max left/right wheel speed [m/s]
    # Max wheel speed change per NMPC step [m/s]. 0.0 disables slew constraints.
    wheel_delta_max: 0.15

    # State tracking cost weights Q = diag(Q_x, Q_y, Q_theta)
    Q_x:     2.0
    Q_y:     2.0
    Q_theta: 0.5

    # Input regularisation weights R = diag(R_v, R_w)
    R_v: 0.1
    R_w: 0.01

    # Terminal cost weights Q_N = diag(QN_x, QN_y, QN_theta)
    QN_x:     4.0
    QN_y:     8.0
    QN_theta: 4.0

    # Safety: stop if odometry is stale for this many seconds
    odom_timeout: 1.0
    imu_timeout: 1.0

    # Fuse wheel odometry and IMU gyro at 50 Hz:
    # d_yaw = (1 - alpha) * d_yaw_encoder + alpha * gz * dt.
    fusion_rate: 50.0
    yaw_fusion_alpha: 0.5
